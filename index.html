<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="汇集家长会视频、教育工具、自建 Skills、公众号文章与项目档案的个人工作台。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 13c9-4 17-2 24 4v35c-7-6-15-8-24-4V13Z' fill='%231166ee'/%3E%3Cpath d='M56 13c-9-4-17-2-24 4v35c7-6 15-8 24-4V13Z' fill='%23ff7a1a'/%3E%3C/svg%3E">
  <title>阅星人读书社｜内容工作台</title>
  <style>
    :root {
      --navy: #102747;
      --navy-2: #17365f;
      --ink: #0a1830;
      --muted: #667790;
      --soft: #8c99ad;
      --line: #dfe6ef;
      --line-strong: #c8d3e2;
      --app: #f3f6fa;
      --surface: #fff;
      --blue: #1166ee;
      --blue-dark: #0756d5;
      --blue-soft: #eaf3ff;
      --orange: #ff7418;
      --orange-soft: #fff0e6;
      --green: #19a675;
      --green-soft: #e5f8f1;
      --violet: #7652df;
      --violet-soft: #f0ebff;
      --gold: #d99505;
      --gold-soft: #fff6d9;
      --shadow: 0 12px 34px rgba(28, 56, 96, .08);
      --sidebar: 232px;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--app);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    ::selection { color: var(--ink); background: #cfe1ff; }

    .icon { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.fill { fill: currentColor; stroke: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 25px 14px 18px;
      color: #e9f1fc;
      background: var(--navy);
      border-right: 1px solid rgba(255,255,255,.07);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 0 12px;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -.02em;
    }
    .brand-book { width: 29px; height: 29px; color: #fff; }
    .side-nav { display: grid; gap: 6px; margin-top: 29px; }
    .nav-button {
      width: 100%;
      min-height: 47px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 13px;
      border: 0;
      border-radius: 8px;
      color: #cbd7e8;
      background: transparent;
      font-size: 14px;
      font-weight: 580;
      text-align: left;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .nav-button:hover { color: white; background: rgba(255,255,255,.065); transform: translateX(2px); }
    .nav-button.is-active { color: white; background: var(--blue); box-shadow: 0 8px 22px rgba(0, 87, 226, .28); }
    .nav-button .nav-count { margin-left: auto; color: rgba(255,255,255,.6); font-size: 11px; font-variant-numeric: tabular-nums; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,.11); padding: 16px 9px 0; }
    .sidebar-stat { display: flex; align-items: center; justify-content: space-between; color: #9fb0c8; font-size: 12px; }
    .manage-link { margin-top: 13px; color: #b8c7da; background: none; border: 0; padding: 0; font-size: 12px; cursor: pointer; }
    .manage-link:hover { color: white; }

    .mobile-header { display: none; }
    .workspace { grid-column: 2; min-width: 0; padding: 18px clamp(18px, 2.6vw, 42px) 56px; }
    .topbar { display: grid; grid-template-columns: minmax(280px, 1fr) auto auto; gap: 12px; align-items: center; max-width: 1280px; margin: 0 auto 18px; }
    .search-box { position: relative; }
    .search-box .icon { position: absolute; left: 16px; top: 50%; color: #74859e; transform: translateY(-50%); }
    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 18px 0 49px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .search-input::placeholder { color: #8996aa; }
    .search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(17,102,238,.12); }
    .action-btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: white;
      font-size: 13px;
      font-weight: 680;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .action-btn:hover { transform: translateY(-1px); border-color: #9fb1ca; box-shadow: 0 7px 17px rgba(32,59,100,.07); }
    .action-btn.primary { color: white; border-color: var(--blue); background: var(--blue); box-shadow: 0 8px 20px rgba(17,102,238,.2); }
    .action-btn.primary:hover { background: var(--blue-dark); }

    .mobile-categories { display: none; }
    .workspace-grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 294px; gap: 16px; align-items: start; }
    .main-panel { min-width: 0; }
    .overview {
      padding: clamp(22px, 2.7vw, 34px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 0 rgba(27,52,90,.02);
    }
    .overview h1 { margin: 0; font-size: clamp(28px, 2.4vw, 37px); line-height: 1.16; letter-spacing: -.04em; }
    .overview-copy { max-width: 780px; margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.72; }
    .count-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 24px; }
    .count-button {
      min-width: 0;
      height: 62px;
      display: grid;
      grid-template-columns: 36px 1fr;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      color: var(--muted);
      background: #f8fafc;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .count-button:hover { transform: translateY(-1px); border-color: var(--line-strong); background: white; }
    .count-button .type-icon { width: 36px; height: 36px; }
    .count-number { display: block; color: var(--ink); font-size: 20px; font-weight: 760; line-height: 1; font-variant-numeric: tabular-nums; }
    .count-label { display: block; margin-top: 5px; font-size: 11px; }

    .featured {
      margin-top: 16px;
      padding: 21px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .feature-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .feature-title { display: flex; align-items: center; gap: 12px; }
    .feature-title h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .feature-title p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .feature-body { display: grid; grid-template-columns: minmax(290px, 1.14fr) minmax(250px, .86fr); gap: 21px; align-items: stretch; margin-top: 17px; }
    .video-cover {
      position: relative;
      min-height: 226px;
      overflow: hidden;
      border-radius: 9px;
      color: white;
      background: #2d7ad8 url("workspace-assets/parent-meeting-cover.png") center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(8,45,95,.08);
    }
    .cover-copy { position: absolute; inset: 0 auto 0 0; width: 50%; display: flex; flex-direction: column; justify-content: center; padding: 28px; }
    .cover-copy strong { font-size: clamp(22px, 2.2vw, 31px); line-height: 1.28; letter-spacing: -.035em; text-shadow: 0 1px 6px rgba(0,61,136,.18); }
    .cover-copy span { margin-top: 11px; font-size: 13px; color: rgba(255,255,255,.88); }
    .play-button { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; display: grid; place-items: center; color: white; background: rgba(8,27,54,.7); border: 1px solid rgba(255,255,255,.28); border-radius: 50%; transform: translate(-50%,-50%); }
    .play-button .icon { width: 23px; height: 23px; margin-left: 3px; fill: currentColor; stroke: none; }
    .feature-info { display: flex; flex-direction: column; justify-content: center; padding: 10px 4px; }
    .feature-info .recent-label { color: var(--blue); font-size: 11px; font-weight: 700; }
    .feature-info h3 { margin: 10px 0 5px; font-size: 20px; letter-spacing: -.025em; }
    .feature-date { color: var(--soft); font-size: 12px; }
    .feature-desc { margin: 15px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .feature-open { align-self: flex-start; }

    .list-panel { margin-top: 16px; padding: 0 16px 9px; background: white; border: 1px solid var(--line); border-radius: 12px; }
    .list-head { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 2px; border-bottom: 1px solid var(--line); }
    .list-head h2 { margin: 0; font-size: 17px; }
    .result-count { color: var(--muted); font-size: 12px; }
    .content-list { display: grid; }
    .content-row {
      min-width: 0;
      min-height: 76px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto 38px;
      align-items: center;
      gap: 12px;
      padding: 11px 7px;
      border-bottom: 1px solid var(--line);
      transition: background .16s ease, transform .16s ease;
    }
    .content-row:last-child { border-bottom: 0; }
    .content-row:hover { background: #f7faff; transform: translateX(2px); }
    .row-main { min-width: 0; cursor: pointer; }
    .row-title-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row-title { overflow: hidden; font-size: 14px; font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .open-mark { flex: 0 0 auto; color: var(--blue); }
    .row-desc { overflow: hidden; margin-top: 5px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { display: flex; align-items: center; gap: 7px; color: var(--soft); font-size: 11px; white-space: nowrap; }
    .fresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #71829a;
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      transition: color .16s ease, background .16s ease;
    }
    .icon-button:hover { color: var(--blue); background: var(--blue-soft); }
    .icon-button.is-pinned { color: var(--blue); }
    .empty-state { padding: 58px 22px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; color: var(--ink); font-size: 16px; }
    .empty-state span { display: block; margin-top: 8px; font-size: 12px; }

    .type-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 9px; }
    .type-video { color: var(--orange); background: var(--orange-soft); }
    .type-tool { color: var(--blue); background: var(--blue-soft); }
    .type-skill { color: var(--violet); background: var(--violet-soft); }
    .type-article { color: var(--green); background: var(--green-soft); }
    .type-project { color: var(--gold); background: var(--gold-soft); }

    .right-rail { display: grid; gap: 16px; }
    .rail-card { padding: 17px; background: white; border: 1px solid var(--line); border-radius: 12px; }
    .rail-title { display: flex; align-items: center; gap: 9px; margin: 0; padding-bottom: 13px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .pinned-list { display: grid; }
    .pinned-item { min-width: 0; min-height: 63px; display: grid; grid-template-columns: 35px minmax(0,1fr) 28px; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
    .pinned-item:last-child { border-bottom: 0; }
    .pinned-item .type-icon { width: 35px; height: 35px; border-radius: 8px; }
    .pinned-title { overflow: hidden; font-size: 12px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .pinned-type { margin-top: 3px; color: var(--soft); font-size: 10px; }
    .pin-remove { width: 28px; height: 28px; }
    .quick-list { display: grid; }
    .quick-button { min-height: 48px; display: flex; align-items: center; gap: 11px; padding: 0 3px; color: var(--muted); background: transparent; border: 0; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; text-align: left; }
    .quick-button:last-child { border-bottom: 0; }
    .quick-button:hover { color: var(--blue); }
    .quick-button .chevron { margin-left: auto; }

    .mobile-bottom { display: none; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(7, 20, 40, .52);
      opacity: 0;
      visibility: hidden;
      transition: opacity .18s ease, visibility .18s ease;
    }
    .modal-backdrop.is-open { opacity: 1; visibility: visible; }
    .modal {
      width: min(100%, 560px);
      max-height: min(90vh, 720px);
      overflow: auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(4,18,39,.26);
      transform: translateY(14px) scale(.99);
      transition: transform .18s ease;
    }
    .modal-backdrop.is-open .modal { transform: none; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 22px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #3a4b65; font-size: 12px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; color: var(--ink); background: #fbfcfe; border: 1px solid var(--line-strong); border-radius: 8px; outline: none; font-size: 13px; }
    .field input, .field select { height: 42px; padding: 0 12px; }
    .field textarea { min-height: 92px; padding: 11px 12px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(17,102,238,.1); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .detail-body { margin-top: 20px; }
    .detail-kicker { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .detail-desc { margin: 19px 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .detail-tag { padding: 6px 9px; color: #49607f; background: #f2f5f9; border-radius: 5px; font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 130; min-width: 220px; max-width: calc(100vw - 40px); padding: 12px 18px; color: white; background: #13233c; border-radius: 9px; box-shadow: 0 14px 32px rgba(5,19,41,.22); font-size: 12px; text-align: center; opacity: 0; transform: translate(-50%, 14px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1120px) {
      .workspace-grid { grid-template-columns: minmax(0, 1fr) 258px; }
      .count-button { grid-template-columns: 1fr; height: 72px; text-align: center; }
      .count-button .type-icon { display: none; }
      .feature-body { grid-template-columns: 1fr; }
      .feature-info { display: grid; grid-template-columns: 1fr auto; column-gap: 18px; }
      .feature-info .recent-label, .feature-info h3, .feature-info .feature-date, .feature-info .feature-desc { grid-column: 1; }
      .feature-open { grid-column: 2; grid-row: 1 / 5; align-self: center; }
    }

    @media (max-width: 920px) {
      .app-shell { display: block; padding-bottom: 70px; }
      .sidebar { display: none; }
      .mobile-header { position: sticky; top: 0; z-index: 40; min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
      .mobile-brand { display: flex; align-items: center; gap: 9px; font-weight: 760; }
      .mobile-brand .brand-book { width: 26px; height: 26px; color: var(--blue); }
      .mobile-actions { display: flex; align-items: center; gap: 8px; }
      .mobile-add { color: white; background: var(--blue); }
      .workspace { padding: 14px 16px 28px; }
      .topbar { grid-template-columns: 1fr auto; margin-bottom: 11px; }
      .topbar .action-btn { display: none; }
      .mobile-categories { max-width: 1280px; margin: 0 auto 12px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
      .mobile-categories::-webkit-scrollbar { display: none; }
      .category-chip { flex: 0 0 auto; min-height: 39px; padding: 0 17px; color: #4b5d77; background: white; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 650; cursor: pointer; }
      .category-chip.is-active { color: white; border-color: var(--blue); background: var(--blue); }
      .workspace-grid { grid-template-columns: 1fr; }
      .right-rail { display: none; }
      .mobile-bottom { position: fixed; inset: auto 0 0; z-index: 50; height: 66px; display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); background: rgba(255,255,255,.96); border-top: 1px solid var(--line); backdrop-filter: blur(15px); }
      .bottom-button { display: grid; place-items: center; align-content: center; gap: 4px; color: #60718a; background: none; border: 0; font-size: 10px; cursor: pointer; }
      .bottom-button .icon { width: 20px; height: 20px; }
      .bottom-button.is-active { color: var(--blue); }
      .toast { bottom: 82px; }
    }

    @media (max-width: 620px) {
      .workspace { padding-inline: 12px; }
      .overview { padding: 22px 18px; }
      .overview h1 { font-size: 29px; }
      .overview-copy { display: none; }
      .count-strip { display: flex; gap: 7px; overflow-x: auto; margin-top: 16px; padding-bottom: 2px; scrollbar-width: none; }
      .count-strip::-webkit-scrollbar { display: none; }
      .count-button { flex: 0 0 92px; height: 58px; display: block; padding: 10px 12px; text-align: left; }
      .count-number { font-size: 18px; }
      .count-label { margin-top: 4px; }
      .featured { padding: 17px; }
      .feature-title h2 { font-size: 18px; }
      .feature-body { gap: 14px; }
      .video-cover { min-height: 190px; }
      .cover-copy { width: 61%; padding: 21px; }
      .cover-copy strong { font-size: 23px; }
      .feature-info { display: block; padding: 2px 0 0; }
      .feature-desc, .feature-info .recent-label, .feature-info .feature-date { display: none; }
      .feature-info h3 { margin: 0 0 13px; font-size: 16px; }
      .content-row { grid-template-columns: 42px minmax(0,1fr) 36px; gap: 10px; }
      .row-meta { grid-column: 2; margin-top: -4px; }
      .content-row > .icon-button { grid-column: 3; grid-row: 1; }
      .row-desc { white-space: normal; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .modal { padding: 20px; }
    }

    /* Accepted 阅星人 light workspace design */
    @font-face {
      font-family: "MiSans Local";
      src: url("workspace-assets/MiSans-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "MiSans Latin Local";
      src: url("workspace-assets/MiSansLatin-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --navy: #102986;
      --navy-deep: #081f6d;
      --navy-soft: #2346a9;
      --ink: #0d287c;
      --muted: #5f70a2;
      --soft: #8694bc;
      --line: #dbe6f5;
      --line-strong: #c5d6ee;
      --app: #ffffff;
      --surface: #ffffff;
      --blue: #0f69d8;
      --blue-dark: #0a4fa7;
      --blue-soft: #eef7ff;
      --lime: #a8dc13;
      --lime-dark: #78ab00;
      --lime-soft: #f3fbdc;
      --yellow: #ffe538;
      --sky: #70cef3;
      --green: #26b948;
      --green-soft: #ecf9e8;
      --shadow: 0 14px 36px rgba(16, 41, 134, .07);
      --sidebar: 242px;
      --sans: "MiSans Local", "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
      --latin: "MiSans Latin Local", "MiSans Local", "Microsoft YaHei", Arial, sans-serif;
    }

    html { background: #fff; }
    body {
      color: var(--ink);

    }

    .app-shell { background: #fff; grid-template-columns: var(--sidebar) minmax(0, 1fr); }

    .sidebar {

    }
    .side-nav { gap: 5px; margin-top: 32px; }
    .nav-button {

    .sidebar-bottom { padding: 18px 13px 0; border-top: 0; }

    .sidebar-stat {

    .sidebar-stat span:first-child { font-family: var(--latin); }
    .manage-link { margin-top: 13px; color: rgba(255,255,255,.66); font-family: var(--sans); font-size: 12px; letter-spacing: 0; }
    .manage-link:hover { color: #fff; }

    .workspace { padding: 20px clamp(24px, 2.7vw, 42px) 56px; background: #fff; }
    .topbar {
      max-width: 1240px;

    }
    .search-input {

    }

    .search-box .icon { color: var(--navy); }
    .action-btn {
      min-height: 46px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
    }
    .action-btn:hover { color: var(--ink); background: #f8fbff; border-color: #a9bee0; box-shadow: 0 7px 18px rgba(16,41,134,.07); }
    .topbar .action-btn.primary, .action-btn.primary {
      display: inline-flex;
      color: var(--navy-deep);
      background: var(--lime);
      border-color: var(--lime);
      box-shadow: none;
    }
    .action-btn.primary:hover { color: var(--navy-deep); background: #b7e72c; border-color: #b7e72c; }

    .workspace-grid { max-width: 1240px; grid-template-columns: minmax(0, 1fr); gap: 0; }
    .overview {
      padding: 0;
      background: #fff;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .hero-grid {

    }
    .hero-visual { min-width: 0; align-self: stretch; display: flex; align-items: center; }
    .hero-visual img {
      width: 100%;
      max-height: 270px;
      object-fit: contain;
      object-position: center;
    }
    .hero-copy { padding: 13px 0 10px; }
    .overview-eyebrow {
      display: block;
      margin: 0 0 22px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .23em;
    }
    .overview h1 {
      max-width: 720px;
      margin: 0;
      color: var(--navy);
      font-family: var(--sans);
      font-size: clamp(42px, 4.35vw, 68px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -.045em;
    }
    .overview-copy {
      display: block;
      max-width: 720px;
      margin: 20px 0 0;
      color: #405996;
      font-size: clamp(14px, 1.3vw, 18px);
      line-height: 1.75;
    }
    .action-btn.hero-add { display: none; }
    .count-strip {

      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 11px;
      margin-top: 18px;
    }
    .count-button {
      position: relative;
      height: 90px;
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      overflow: hidden;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      text-align: left;
    }
    .count-button:hover { color: var(--ink); background: #fbfdff; border-color: #93afd8; transform: translateY(-2px); }
    .count-button.is-active { border-color: var(--line-strong); background: var(--lime-soft); box-shadow: none; }
    .count-button .type-icon { width: 42px; height: 42px; color: var(--navy); background: transparent; }
    .count-number { color: var(--lime-dark); font-size: 31px; font-weight: 400; line-height: 1; }

    .featured {
      margin-top: 16px;
      padding: 0;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .feature-head { min-height: 70px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .feature-title .type-icon { color: var(--navy); background: #eaf4ff; }
    .feature-title h2 { color: var(--navy); font-family: var(--sans); font-size: 22px; font-weight: 800; }
    .feature-title p { color: var(--muted); font-size: 12px; }
    .feature-body { grid-template-columns: minmax(470px, 1.35fr) minmax(300px, .65fr); gap: 0; margin: 0; }
    .video-cover {

    .cover-copy { z-index: 1; width: 52%; padding: 30px; }
    .cover-copy span { order: 0; margin: 0 0 10px; color: #fff; font-family: var(--sans); font-size: 14px; }
    .cover-copy strong { order: 1; color: #fff; font-family: var(--sans); font-size: clamp(31px, 3.1vw, 45px); font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.28); }
    .play-button { z-index: 2; left: 50%; top: 50%; right: auto; bottom: auto; width: 60px; height: 60px; color: #fff; background: rgba(7,24,66,.52); border: 2px solid rgba(255,255,255,.9); transform: translate(-50%,-50%); }
    .feature-info { padding: 26px 30px; border-left: 1px solid var(--line); }
    .feature-info .recent-label { color: var(--lime-dark); font-family: var(--sans); font-size: 12px; letter-spacing: 0; text-transform: none; }
    .feature-info h3 { margin: 11px 0 6px; color: var(--navy); font-family: var(--sans); font-size: 27px; font-weight: 800; line-height: 1.25; letter-spacing: -.025em; white-space: nowrap; }
    .feature-date { color: var(--soft); font-size: 13px; }
    .feature-desc { margin: 14px 0 17px; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .video-directory {
      display: grid;
      grid-template-columns: minmax(260px, .72fr) minmax(0, 1.28fr);
      gap: 22px;
      padding: 20px;
    }
    .video-group { min-width: 0; }
    .video-group-label {
      display: block;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .collection-link {
      min-height: 224px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 14px;
      padding: 22px;
      color: var(--navy);
      background: var(--lime-soft);
      border: 1px solid #cce87b;
      border-radius: 13px;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .collection-link:hover {
      background: #eef9c7;
      border-color: var(--lime-dark);
      transform: translateY(-2px);
    }
    .collection-link strong { font-size: 18px; line-height: 1.45; }
    .directory-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: var(--navy);
      background: #fff;
      border-radius: 12px;
    }
    .directory-icon .icon { width: 23px; height: 23px; }
    .directory-arrow { width: 20px; height: 20px; color: var(--navy); }
    .video-link-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
    }
    .video-link-list a {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 15px;

      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      transition: color .16s ease, background .16s ease, padding .16s ease;

    .video-link-list a:last-child { border-bottom: 0; }
    .video-link-list a:hover { color: var(--blue-dark); background: #f7fbff; padding-left: 18px; }
    .video-link-list .icon { width: 17px; height: 17px; flex: 0 0 17px; color: var(--soft); }

    .list-panel { position: relative; margin-top: 16px; padding: 0; background: #fff; border: 0; border-radius: 0; }
    .list-head { min-height: 68px; padding: 0; border-bottom: 1px solid var(--line-strong); }
    .list-head h2 { color: var(--navy); font-family: var(--sans); font-size: 25px; font-weight: 800; }
    .list-tools { position: relative; display: flex; align-items: center; gap: 12px; }
    .result-count { color: var(--muted); font-family: var(--latin); font-size: 12px; }
    .filter-toggle {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-toggle .icon { width: 17px; height: 17px; }
    .filter-menu {
      position: absolute;
      z-index: 20;
      right: 0;
      top: 45px;
      width: 172px;
      padding: 7px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 42px rgba(16,41,134,.14);
    }
    .filter-menu[hidden] { display: none; }
    .filter-menu button {
      width: 100%;
      min-height: 39px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-menu button:hover { background: var(--lime-soft); }
    .filter-menu .icon { width: 16px; height: 16px; }
    .content-list { display: grid; }
    .content-row {
      min-height: 59px;
      grid-template-columns: 36px minmax(0, 1fr) 122px 106px 104px 36px;
      gap: 10px;
      padding: 9px 4px;
      border-bottom: 1px solid var(--line);
    }
    .content-row:hover { background: #f8fbff; transform: none; }
    .content-row .type-icon { width: 34px; height: 34px; border-radius: 9px; }
    .row-title { color: var(--ink); font-size: 13px; font-weight: 700; }
    .row-desc { display: none; }
    .row-type { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .row-status {
      justify-self: start;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      color: var(--ink);
      background: #f5f8fd;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
    }
    .row-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sky); }
    .row-status.status-published::before, .row-status.status-ready::before { background: var(--green); }
    .row-status.status-iterating::before { background: var(--lime); }
    .row-status.status-planning::before { background: var(--yellow); }
    .row-meta { color: var(--muted); font-family: var(--latin); font-size: 12px; }
    .row-meta .fresh-dot, .row-meta .meta-type { display: none; }
    .open-mark { color: var(--blue); }
    .icon-button { color: var(--soft); }
    .icon-button:hover { color: var(--navy); background: var(--blue-soft); }
    .icon-button.is-pinned { color: var(--lime-dark); }
    .type-video, .type-tool, .type-skill, .type-article, .type-project { color: var(--navy); background: #eef6ff; }
    .empty-state strong { color: var(--ink); }

    .archive-banner {
      width: 100%;
      min-height: 82px;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      margin-top: 12px;
      padding: 14px 20px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
    }
    .archive-banner:hover { background: #fbfdff; border-color: #adc3e3; }
    .archive-icon { width: 46px; height: 46px; display: grid; place-items: center; color: var(--navy); background: var(--lime-soft); border-radius: 11px; }
    .archive-banner strong { display: block; color: var(--navy); font-size: 17px; }
    .archive-banner small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .archive-open { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
    .archive-open .icon { width: 17px; height: 17px; }
    .right-rail { display: none; }

    .modal-backdrop { background: rgba(8,31,109,.42); }
    .modal {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 28px 80px rgba(8,31,109,.24);
    }
    .modal-head h2 { color: var(--navy); font-family: var(--sans); font-size: 22px; font-weight: 800; }
    .field label { color: var(--ink); }
    .field input, .field select, .field textarea { color: var(--ink); background: #fbfdff; border-color: var(--line-strong); font-family: var(--sans); }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(15,105,216,.1); }
    .detail-kicker, .detail-desc { color: var(--muted); }
    .detail-tag { color: var(--ink); background: var(--blue-soft); }
    .entry-note {
      margin: 18px 0 0;
      padding: 12px 14px;
      color: var(--muted);
      background: #f7faff;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.65;
    }
    .toast { color: #fff; background: var(--navy-deep); border-radius: 10px; }

    @media (max-width: 1120px) {
      .hero-grid { grid-template-columns: minmax(320px, .8fr) minmax(420px, 1.2fr); gap: 28px; }
      .overview h1 { font-size: clamp(40px, 5.2vw, 58px); }
      .count-button { grid-template-columns: 1fr; height: 86px; text-align: center; }
      .count-button .type-icon { display: none; }
      .feature-body { grid-template-columns: 1.15fr .85fr; }
      .feature-info { display: flex; }
      .feature-open { align-self: flex-start; }
    }

    @media (max-width: 920px) {
      .app-shell { display: block; padding-bottom: 74px; background: #fff; }
      .sidebar { display: none; }
      .mobile-header {
        min-height: 72px;
        color: var(--navy);
        background: rgba(255,255,255,.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }
      .mobile-brand { gap: 9px; color: var(--navy); font-family: var(--sans); font-size: 17px; font-weight: 800; }
      .mobile-brand .logo-mark { width: 42px; height: 42px; flex-basis: 42px; border-radius: 11px; }
      .mobile-brand .logo-mark img { width: 100%; }
      .mobile-actions .icon-button { width: 42px; height: 42px; color: var(--navy); border: 1px solid var(--line); border-radius: 50%; }
      .mobile-actions .mobile-add { color: var(--navy-deep); background: var(--lime); border-color: var(--lime); }
      .workspace { padding: 20px 18px 28px; }
      .topbar { display: none; position: sticky; top: 82px; z-index: 35; grid-template-columns: 1fr; margin-bottom: 14px; }
      .topbar.is-mobile-open { display: grid; }
      .topbar .action-btn { display: none; }
      .mobile-categories { display: none; }
      .workspace-grid { grid-template-columns: 1fr; }
      .hero-grid { min-height: 420px; position: relative; display: block; overflow: hidden; }
      .hero-copy { position: relative; z-index: 2; width: 64%; padding: 8px 0 0; }
      .hero-visual { position: absolute; z-index: 1; right: -6%; bottom: 2px; width: 66%; height: 74%; display: block; }
      .hero-visual img { width: 100%; height: 100%; max-height: none; object-fit: contain; object-position: right bottom; }
      .overview-eyebrow { margin-bottom: 18px; font-size: 10px; letter-spacing: .18em; white-space: nowrap; }
      .overview h1 { max-width: 330px; font-size: clamp(39px, 10.5vw, 55px); line-height: 1.17; }
      .overview-copy { max-width: 285px; margin-top: 18px; font-size: 14px; line-height: 1.68; }
      .action-btn.hero-add { display: inline-flex; margin-top: 20px; }
      .count-strip { display: flex; gap: 10px; overflow-x: auto; margin-top: 14px; padding: 0 1px 4px; scrollbar-width: none; }
      .count-strip::-webkit-scrollbar { display: none; }
      .count-button { flex: 0 0 104px; height: 104px; display: block; padding: 16px 13px; text-align: left; }
      .count-button .type-icon { display: block; width: 28px; height: 28px; margin-bottom: 5px; }
      .count-number { font-size: 27px; }
      .count-label { font-size: 12px; }
      .feature-body { grid-template-columns: 1fr; }
      .feature-info { display: block; border-left: 0; border-top: 1px solid var(--line); }
      .feature-open { align-self: flex-start; }
      .video-directory { grid-template-columns: 1fr; gap: 17px; padding: 17px; }
      .collection-link { min-height: 82px; padding: 16px; }
      .right-rail { display: none; }
      .mobile-bottom { height: 72px; background: rgba(255,255,255,.97); border-top-color: var(--line); backdrop-filter: blur(18px); }
      .bottom-button { color: var(--muted); font-family: var(--sans); }
      .bottom-button.is-active { color: var(--lime-dark); }
      .content-row { grid-template-columns: 38px minmax(0,1fr) 36px; min-height: 72px; padding: 10px 3px; }
      .row-desc { display: block; }
      .row-type, .row-status { display: none; }
      .row-meta { grid-column: 2; margin-top: -7px; }
      .content-row > .icon-button { grid-column: 3; grid-row: 1; }
      .archive-banner { margin-bottom: 16px; }
      .toast { bottom: 84px; }
    }

    @media (max-width: 620px) {
      .workspace { padding-inline: 14px; }
      .hero-grid { min-height: 415px; }
      .hero-copy { width: 66%; }
      .hero-visual { right: -10%; bottom: -2px; width: 72%; height: 72%; }
      .overview-eyebrow { margin-bottom: 16px; font-size: 9px; }
      .overview h1 { font-size: clamp(38px, 10.8vw, 48px); letter-spacing: -.045em; }
      .overview-copy { max-width: 250px; font-size: 13px; }
      .hero-add { min-height: 46px; padding-inline: 18px; border-radius: 999px; }
      .featured { margin-top: 15px; }
      .feature-head { min-height: 68px; padding: 0 15px; }
      .feature-title h2 { font-size: 19px; }
      .video-cover { min-height: 220px; }
      .cover-copy { width: 62%; padding: 22px; }
      .cover-copy strong { font-size: 30px; }
      .feature-info { padding: 19px 20px 21px; }
      .feature-info .recent-label, .feature-desc { display: none; }
      .feature-info h3 { margin-top: 0; font-size: 22px; white-space: normal; }
      .feature-open { float: right; margin-top: -42px; min-height: 40px; border-radius: 999px; }
      .video-link-list a { min-height: 48px; padding-inline: 14px; font-size: 13px; }
      .list-head h2 { font-size: 23px; }
      .result-count { display: none; }
      .archive-banner { grid-template-columns: 42px minmax(0, 1fr); padding: 13px 15px; }
      .archive-open { display: none; }
      .archive-banner small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .modal { padding: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }

      { id:'project-ip', type:'project', title:'阅星人动物 IP 世界观', description:'围绕 12 个动物角色整理教育理念、成长力量与品牌故事。', date:'2026-08-08', url:'https://hanroots.github.io/reading-partners-ip-site/?v=df33f51', openLabel:'打开 IP 世界观', tags:['IP','品牌','故事'], status:'planning', pinned:false }
    ];

    const statusMeta = {
      published: '已发布',
      ready: '可使用',
      iterating: '迭代中',
      planning: '规划中',
      custom: '自定义'
    };

    const customKey = 'codexWorkspaceCustomItemsV1';
    const pinKey = 'codexWorkspacePinnedV1';
    let customItems = safeParse(localStorage.getItem(customKey), []);
    let pinOverrides = safeParse(localStorage.getItem(pinKey), {});
    let activeType = 'all';
    let quickFilter = null;
    let searchTerm = '';

    function safeParse(value, fallback) { try { return value ? JSON.parse(value) : fallback; } catch { return fallback; } }
    function allItems() { return [...customItems, ...seedItems].map(item => ({...item, pinned: pinOverrides[item.id] ?? item.pinned})); }
    function iconMarkup(type) { const icon = typeMeta[type]?.icon || 'file'; return `<svg class="icon"><use href="#i-${icon}"/></svg>`; }
    function typeIcon(type) { return `<div class="type-icon type-${type}">${iconMarkup(type)}</div>`; }
    function typeCount(type) { return allItems().filter(i => i.type === type).length; }
    function formatDate(date) { return (date || '').replaceAll('-', '.'); }
    function isRecent(date) { return date >= '2026-08-18'; }
    function matches(item) {
      if (activeType !== 'all' && item.type !== activeType) return false;
      if (quickFilter === 'openable' && !item.url) return false;
      if (quickFilter === 'iterating' && item.status !== 'iterating') return false;
      if (quickFilter === 'recent' && !isRecent(item.date)) return false;
      if (quickFilter === 'pinned' && !item.pinned) return false;
      if (!searchTerm) return true;
      const haystack = [item.title, item.description, ...(item.tags || []), typeMeta[item.type].label].join(' ').toLowerCase();
      return haystack.includes(searchTerm.toLowerCase());
    }

    function renderNavigation() {
      const order = ['all','video','tool','skill','article','project'];
      document.getElementById('sideNav').innerHTML = order.map(type => `<button class="nav-button ${activeType === type ? 'is-active' : ''}" data-type="${type}">${iconMarkup(type)}<span class="${type === 'skill' ? 'latin' : ''}">${typeMeta[type].label}</span><span class="nav-count">${type === 'all' ? allItems().length : typeCount(type)}</span></button>`).join('');
      document.getElementById('mobileCategories').innerHTML = order.map(type => `<button class="category-chip ${activeType === type ? 'is-active' : ''}" data-type="${type}"><span class="${type === 'skill' ? 'latin' : ''}">${typeMeta[type].short}</span></button>`).join('');
      document.getElementById('sidebarTotal').textContent = `${allItems().length} 项内容`;
      document.querySelectorAll('[data-type]').forEach(button => { button.onclick = () => { activeType = button.dataset.type; quickFilter = null; renderAll(); }; });
    }

    function renderCounts() {
      const order = ['video','tool','skill','article','project'];
      document.getElementById('countStrip').innerHTML = order.map(type => `<button class="count-button ${activeType === type ? 'is-active' : ''}" data-count-type="${type}">${typeIcon(type)}<span><span class="count-number">${typeCount(type)}</span><span class="count-label ${type === 'skill' ? 'latin' : ''}">${typeMeta[type].short}</span></span></button>`).join('');
      document.querySelectorAll('[data-count-type]').forEach(button => button.addEventListener('click', () => { activeType = button.dataset.countType; quickFilter = null; renderAll(); document.getElementById('listTitle').scrollIntoView({behavior:'smooth', block:'start'}); }));
    }

    function getFilteredItems() {
      return allItems().filter(matches).sort((a,b) => {
        if (activeType === 'article' && (a.seriesOrder || b.seriesOrder)) return (b.seriesOrder || 0) - (a.seriesOrder || 0);
        return (b.date || '').localeCompare(a.date || '') || a.title.localeCompare(b.title, 'zh-CN');
      });
    }

    function renderList() {
      const items = getFilteredItems();
      const listTitle = searchTerm ? `“${searchTerm}”的搜索结果` : quickFilter === 'pinned' ? '置顶内容' : activeType === 'all' ? '最近更新' : typeMeta[activeType].label;
      document.getElementById('listTitle').textContent = listTitle;
      document.getElementById('resultCount').textContent = `${items.length} 项`;
      const list = document.getElementById('contentList');
      if (!items.length) { list.innerHTML = `<div class="empty-state"><strong>没有找到相关内容</strong><span>换一个关键词，或清除筛选条件后再试。</span></div>`; return; }
      list.innerHTML = items.map(item => `<article class="content-row" data-item-id="${item.id}">
        ${typeIcon(item.type)}
        <div class="row-main" tabindex="0" role="button" aria-label="查看 ${item.title}"><div class="row-title-line"><span class="row-title">${formatMixedText(item.title)}</span>${item.url ? `<svg class="icon open-mark" width="14" height="14"><use href="#i-link"/></svg>` : ''}</div><div class="row-desc">${formatMixedText(item.description)}</div></div>
        <span class="row-type ${item.type === 'skill' ? 'latin' : ''}">${typeMeta[item.type].label}</span>
        <span class="row-status status-${item.status || 'custom'}">${statusMeta[item.status] || statusMeta.custom}</span>
        <div class="row-meta">${isRecent(item.date) ? '<i class="fresh-dot"></i>' : ''}${item.seriesOrder ? `<span class="series-index">第 ${item.seriesOrder} 篇</span>` : `<span class="meta-type">${typeMeta[item.type].short}</span>`}${item.date ? `<time>${item.seriesOrder ? '· ' : ''}${formatDate(item.date)}</time>` : ''}</div>
        <button class="icon-button ${item.pinned ? 'is-pinned' : ''}" data-pin-id="${item.id}" aria-label="${item.pinned ? '取消置顶' : '置顶'} ${item.title}"><svg class="icon"><use href="#i-star"/></svg></button>
      </article>`).join('');
      document.querySelectorAll('.row-main').forEach(el => { el.addEventListener('click', () => openItem(el.closest('[data-item-id]').dataset.itemId)); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openItem(el.closest('[data-item-id]').dataset.itemId); } }); });
      document.querySelectorAll('[data-pin-id]').forEach(button => button.addEventListener('click', e => { e.stopPropagation(); togglePin(button.dataset.pinId); }));
    }

    function renderPinned() {
      const items = allItems().filter(i => i.pinned).slice(0,6);
      document.getElementById('pinnedList').innerHTML = items.length ? items.map(item => `<div class="pinned-item" data-item-id="${item.id}">${typeIcon(item.type)}<div><div class="pinned-title" tabindex="0">${escapeHtml(item.title)}</div><div class="pinned-type">${typeMeta[item.type].label}</div></div><button class="icon-button pin-remove is-pinned" data-pin-id="${item.id}" aria-label="取消置顶 ${item.title}"><svg class="icon"><use href="#i-pin"/></svg></button></div>`).join('') : '<div class="empty-state"><span>还没有置顶内容</span></div>';
      document.querySelectorAll('.pinned-item .pinned-title').forEach(el => el.addEventListener('click', () => openItem(el.closest('[data-item-id]').dataset.itemId)));
      document.querySelectorAll('.pin-remove').forEach(button => button.addEventListener('click', () => togglePin(button.dataset.pinId)));
    }

    function renderFeature() { document.getElementById('featuredSection').hidden = !(activeType === 'all' || activeType === 'video') || !!searchTerm || !!quickFilter; }
    function renderAll() { renderNavigation(); renderCounts(); renderFeature(); renderList(); renderPinned(); updateBottomNav(); }

    function togglePin(id) { const item = allItems().find(i => i.id === id); if (!item) return; pinOverrides[id] = !item.pinned; localStorage.setItem(pinKey, JSON.stringify(pinOverrides)); renderAll(); showToast(pinOverrides[id] ? '已置顶' : '已取消置顶'); }
    function openItem(id) { const item = allItems().find(i => i.id === id); if (!item) return; showDetail(item); }

    function showDetail(item) {
      document.getElementById('detailTitle').innerHTML = formatMixedText(item.title);
      const entryNote = item.launchNote || (!item.url ? '当前没有可直接打开的网页入口。' : '');
      document.getElementById('detailBody').innerHTML = `<div class="detail-kicker">${typeIcon(item.type)}<span>${typeMeta[item.type].label}${item.date ? ` · <span class="latin">${formatDate(item.date)}</span>` : ''}</span></div><p class="detail-desc">${formatMixedText(item.description)}</p><div class="detail-tags">${(item.tags || []).map(tag => `<span class="detail-tag">${formatMixedText(tag)}</span>`).join('')}</div>${entryNote ? `<p class="entry-note">${formatMixedText(entryNote)}</p>` : ''}`;
      const open = document.getElementById('detailOpen');
      open.hidden = !item.url;
      open.textContent = item.openLabel || (item.type === 'tool' ? '打开工具' : '打开内容');
      if (item.url) open.href = item.url; else open.removeAttribute('href');
      const copy = document.getElementById('detailCopy');
      copy.hidden = !item.localPath;
      copy.textContent = item.copyLabel || '复制本地路径';
      copy.dataset.path = item.localPath || '';
      openModal(document.getElementById('detailModal'));
    }

    async function copyText(value) {
      try { await navigator.clipboard.writeText(value); return true; }
      catch {
        const input = document.createElement('textarea'); input.value = value; input.style.position = 'fixed'; input.style.opacity = '0'; document.body.appendChild(input); input.select();
        const copied = document.execCommand('copy'); input.remove(); return copied;
      }
    }

    function openModal(modal) { modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); document.body.style.overflow = 'hidden'; setTimeout(() => modal.querySelector('input, button, a')?.focus(), 30); }
    function closeModal(modal) { modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); document.body.style.overflow = ''; }
    function escapeHtml(value='') { return value.replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    function formatMixedText(value='') { return escapeHtml(value).replace(/([A-Za-z0-9]+(?:[ .+/-][A-Za-z0-9]+)*)/g, '<span class="latin">$1</span>'); }
    let toastTimer;
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('is-visible'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200); }

    document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value.trim(); quickFilter = null; renderFeature(); renderList(); });
    document.getElementById('filterToggle').addEventListener('click', e => {
      e.stopPropagation();
      const menu = document.getElementById('filterMenu');
      menu.hidden = !menu.hidden;
      e.currentTarget.setAttribute('aria-expanded', String(!menu.hidden));
    });
    document.addEventListener('click', e => {
      const menu = document.getElementById('filterMenu');
      if (!menu.hidden && !e.target.closest('.list-tools')) {
        menu.hidden = true;
        document.getElementById('filterToggle').setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('mobileSearch').addEventListener('click', () => {
      const topbar = document.querySelector('.topbar');
      topbar.classList.toggle('is-mobile-open');
      if (topbar.classList.contains('is-mobile-open')) setTimeout(() => document.getElementById('searchInput').focus(), 30);
    });
    document.querySelectorAll('[data-open-add]').forEach(button => button.addEventListener('click', () => openModal(document.getElementById('addModal'))));
    document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', () => closeModal(document.getElementById('addModal'))));
    document.querySelectorAll('[data-close-detail]').forEach(button => button.addEventListener('click', () => closeModal(document.getElementById('detailModal'))));
    document.getElementById('detailCopy').addEventListener('click', async e => {
      const copied = await copyText(e.currentTarget.dataset.path || '');
      showToast(copied ? '本地路径已复制' : '复制失败，请手动记录路径');
    });
    document.querySelectorAll('.modal-backdrop').forEach(modal => modal.addEventListener('click', e => { if (e.target === modal) closeModal(modal); }));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.is-open').forEach(closeModal); });

    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(e.currentTarget);
      customItems.unshift({ id:`custom-${Date.now()}`, type:data.get('type'), title:data.get('title').trim(), description:data.get('description').trim(), date:data.get('date'), url:data.get('url').trim(), tags:data.get('tags').split(/[,，]/).map(t=>t.trim()).filter(Boolean), status:'custom', pinned:false });
      localStorage.setItem(customKey, JSON.stringify(customItems));
      e.currentTarget.reset(); document.getElementById('itemDate').value = '2026-09-17'; closeModal(document.getElementById('addModal')); activeType = 'all'; searchTerm = ''; document.getElementById('searchInput').value = ''; renderAll(); showToast('内容已保存到工作台');
    });

    document.getElementById('exportButton').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), items:allItems() }, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `codex-workspace-${new Date().toISOString().slice(0,10)}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); showToast('清单已导出');
    });

    document.querySelectorAll('[data-quick]').forEach(button => button.addEventListener('click', () => {
      activeType = 'all'; quickFilter = button.dataset.quick; searchTerm = ''; document.getElementById('searchInput').value = '';
      document.getElementById('filterMenu').hidden = true;
      document.getElementById('filterToggle').setAttribute('aria-expanded', 'false');
      renderAll(); document.getElementById('listTitle').scrollIntoView({behavior:'smooth'});
    }));
    document.getElementById('manageCategories').addEventListener('click', () => showToast('分类已按视频、工具、Skills、文章和档案整理'));

    document.querySelectorAll('[data-bottom]').forEach(button => button.addEventListener('click', () => {
      const mode = button.dataset.bottom;
      if (mode === 'all') { activeType = 'all'; quickFilter = null; }
      if (mode === 'pinned') { activeType = 'all'; quickFilter = 'pinned'; }
      if (mode === 'recent') { activeType = 'all'; quickFilter = 'recent'; }
      if (mode === 'more') { openModal(document.getElementById('addModal')); return; }
      searchTerm = ''; document.getElementById('searchInput').value = ''; renderAll(); window.scrollTo({top:0, behavior:'smooth'});
    }));

    function updateBottomNav() {
      document.querySelectorAll('[data-bottom]').forEach(button => button.classList.remove('is-active'));
      const target = quickFilter === 'pinned' ? 'pinned' : quickFilter === 'recent' ? 'recent' : 'all';
      document.querySelector(`[data-bottom="${target}"]`)?.classList.add('is-active');
    }

    renderAll();
  </script>
</body>
</html>
